# Tap In backend: auth + local-first sync (+ push reminders next). Free tier: Workers + D1.
name = "tap-in"
main = "src/index.ts"
compatibility_date = "2026-11-01"

[[d1_databases]]
binding = "DB"
database_name = "tap-in"
database_id = "94b1aaa7-d623-4e67-a14d-6a07eac2b2a0"  # filled in by setup; not a secret

[triggers]
crons = ["* * * * *"] # reminders: check every minute

[vars]
# Origins allowed to call the API (GitHub Pages + local dev). Comma separated.
ALLOWED_ORIGINS = "https://splitbn.github.io,http://localhost:5173"
VAPID_SUBJECT = "https://splitbn.github.io/Tap-In/"
# VAPID_PUBLIC_KEY: set with `wrangler secret put VAPID_PUBLIC_KEY` (public by design, stored as a secret for one place to manage)

# Rest-over alerts: one SQLite-backed Durable Object per device (alarm at the exact second rest ends).
[[durable_objects.bindings]]
name = "REST_ALARM"
class_name = "RestAlarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RestAlarm"]

# AI agent: one SQLite-backed Durable Object per user holds the ChatGPT tokens and serialises their (rotating) refresh.
# Secret: AI_ENC_KEY (base64 of 32 random bytes) encrypts AI credentials at rest.
[[durable_objects.bindings]]
name = "AI_AUTH"
class_name = "AiAuth"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["AiAuth"]
